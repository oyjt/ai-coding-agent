permissions:
  allow:
    - Bash
    - Edit
    - Glob
    - Grep
    - KillShell
    - LS
    - LSP
    - MultiEdit
    - NotebookEdit
    - NotebookRead
    - Read
    - Skill
    - Task
    - TaskCreate
    - TaskGet
    - TaskList
    - TaskOutput
    - TaskStop
    - TaskUpdate
    - TodoWrite
    - ToolSearch
    - WebFetch
    - WebSearch
    - Write
  deny:
    - 'Bash(rm -rf:*)'
    - 'Bash(curl | bash:*)'
    - 'Bash(DROP:*)'
    - 'Bash(TRUNCATE:*)'
    - 'Write(.env*)'
