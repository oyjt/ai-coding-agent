lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  packages/cli:
    dependencies:
      '@ai-coding-agent/config':
        specifier: workspace:*
        version: link:../config
      '@ai-coding-agent/core':
        specifier: workspace:*
        version: link:../core

  packages/config:
    dependencies:
      yaml:
        specifier: ^2.8.1
