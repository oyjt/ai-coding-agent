lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@types/node':
        specifier: ^22.15.21
        version: 22.15.21
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  packages/cli:
    dependencies:
      '@ai-coding-agent/config':
        specifier: workspace:*
        version: link:../config
      '@ai-coding-agent/core':
        specifier: workspace:*
        version: link:../core

  packages/config:
    dependencies:
      yaml:
        specifier: ^2.8.1
        version: 2.8.1

  packages/core:
    dependencies:
      '@ai-coding-agent/config':
        specifier: workspace:*
        version: link:../config
      yaml:
        specifier: ^2.8.1
        version: 2.8.1

packages:

  '@types/node@22.15.21':
    resolution: {}
    dependencies:
      undici-types: 6.21.0

  typescript@5.9.2:
    resolution: {}
    engines: {node: '>=14.17'}
    hasBin: true

  undici-types@6.21.0:
    resolution: {}

  yaml@2.8.1:
    resolution: {}
    engines: {node: '>= 14'}

snapshots:

  '@types/node@22.15.21':
    dependencies:
      undici-types: 6.21.0

  typescript@5.9.2: {}

  undici-types@6.21.0: {}

  yaml@2.8.1: {}
