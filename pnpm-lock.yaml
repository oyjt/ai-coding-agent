lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  packages/cli:
    dependencies:
      '@ai-coding-agent/config':
        specifier: workspace:*
        version: link:../config
      '@ai-coding-agent/core':
        specifier: workspace:*
        version: link:../core

  packages/config:
    dependencies:
      yaml:
        specifier: ^2.8.1
        version: 2.8.1

  packages/core:
    dependencies:
      '@ai-coding-agent/config':
        specifier: workspace:*
        version: link:../config

packages:

  typescript@5.9.2:
    resolution: {}
    engines: {node: '>=14.17'}
    hasBin: true

  yaml@2.8.1:
    resolution: {}
    engines: {node: '>= 14'}

snapshots:

  typescript@5.9.2: {}

  yaml@2.8.1: {}
